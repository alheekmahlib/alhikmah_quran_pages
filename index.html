<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مكتبة الحكمة · القرآن الكريم">
  <meta name="referrer" content="no-referrer">

  <title>مكتبة الحكمة · القرآن الكريم</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FBF7EE;
      font-family: 'Cairo', 'Mada', system-ui, sans-serif;
    }
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #FBF7EE;
      transition: opacity 0.4s ease;
    }
    #flutter-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .fl-star {
      width: 48px;
      height: 48px;
      color: #2D6A4F;
      animation: fl-spin 2s linear infinite;
    }
    .fl-text {
      color: #2A1F12;
      font-size: 14px;
      font-weight: 600;
    }
    @keyframes fl-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="flutter-loading">
    <svg class="fl-star" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L14.39 8.26L21 9.27L16 14.14L17.18 21L12 17.77L6.82 21L8 14.14L3 9.27L9.61 8.26L12 2Z"/>
    </svg>
    <div class="fl-text">جارٍ تحميل القرآن الكريم...</div>
  </div>

  <script>
    // ===== اقرأ theme من الرابط (search أو hash) =====
    function getThemeParam() {
      // جرّب window.location.search أولاً
      var searchParams = new URLSearchParams(window.location.search);
      var theme = searchParams.get('theme');
      if (theme) return theme;

      // ثم جرّب hash (Flutter web routing)
      var hash = window.location.hash;
      if (hash && hash.includes('theme=')) {
        var hashParams = new URLSearchParams(hash.split('?')[1] || '');
        theme = hashParams.get('theme');
        if (theme) return theme;
      }
      return 'light';
    }

    function applyTheme(mode) {
      var bgColor = mode === 'dark' ? '#0F1814' : '#FBF7EE';
      var fgColor = mode === 'dark' ? '#52B788' : '#2D6A4F';
      var textColor = mode === 'dark' ? '#F5EBD6' : '#2A1F12';

      document.documentElement.style.backgroundColor = bgColor;
      document.body.style.backgroundColor = bgColor;

      var loader = document.getElementById('flutter-loading');
      if (loader) {
        loader.style.backgroundColor = bgColor;
        var star = loader.querySelector('.fl-star');
        var text = loader.querySelector('.fl-text');
        if (star) star.style.color = fgColor;
        if (text) text.style.color = textColor;
      }
    }

    // طبّق فورًا — اقرأ theme من أي مكان في الرابط
    var initialTheme = getThemeParam();
    // اقرأ أيضًا من hash الكامل (Flutter routing)
    if (!initialTheme || initialTheme === 'light') {
      var fullHash = window.location.hash;
      if (fullHash && fullHash.includes('theme=dark')) {
        initialTheme = 'dark';
      }
    }
    // ★ خزّن في JS global قبل أن يحذفه Flutter bootstrap
    window.__QURAN_THEME__ = initialTheme;
    applyTheme(initialTheme);

    // إخفاء شاشة التحميل بعد بدء Flutter
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('flutter-loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 500);
      }
      try { window.parent.postMessage({ type: 'quran:ready' }, '*'); } catch (e) {}
    });

    // استمع لتغييرات الثيم من الموقع الأم
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'theme:set' && (data.mode === 'light' || data.mode === 'dark')) {
        applyTheme(data.mode);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
